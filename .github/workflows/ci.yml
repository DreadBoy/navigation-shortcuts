# CI: unit tests + lint, the E2E suite on an emulator (real Niagara + real Google Maps), then the release build.
# Docs: docs/release-procedure.md ("CI and release workflows").
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml on a v* tag, so a release is built from exactly the same verified pipeline.
  workflow_call:
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: false
      RELEASE_STORE_PASSWORD:
        required: false
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Unit tests, lint, debug build
        run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Upload unit test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            app/build/reports/
            anycons/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (emulator, Niagara, Google Maps)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Niagara Launcher from the developer's GitHub releases (decisions 1.1). To bump: change both values;
      # the sha256 is on the release asset (GitHub API "digest") or from `shasum -a 256` of the downloaded APK.
      NIAGARA_VERSION: "1.16.33"
      NIAGARA_SHA256: "639d0578eb50b9b2d79937360b0ff65145760022fe1273053b4338a7103e84f3"
      # Overall limit for run-e2e.sh's Gradle part (build/install + both test passes), seconds.
      E2E_TIMEOUT: "2700"
      # setup-emulator.sh retry counts x3: first cold boot with a software GPU is much slower than the local AVD.
      SETUP_LOOP_SCALE: "3"
      # Limit for setup-emulator.sh inside run-e2e.sh, seconds (boot ~15 + setup 30 + E2E 45 min < 120 min job).
      SETUP_TIMEOUT: "1800"
      # The suite's standard UI waits (5 s / 20 s) x2 on the software-GPU emulator.
      E2E_WAIT_SCALE: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Niagara (pinned version and sha256)
        run: |
          dir="$RUNNER_TEMP/niagara"
          mkdir -p "$dir"
          apk="$dir/Niagara_Launcher_v${NIAGARA_VERSION}-release.apk"
          url="https://github.com/NiagaraLauncher/Niagara-Issues/releases/download/v${NIAGARA_VERSION}/Niagara_Launcher_v${NIAGARA_VERSION}-release.apk"
          curl -fsSL --retry 3 --retry-delay 5 -o "$apk" "$url"
          if ! echo "${NIAGARA_SHA256}  ${apk}" | sha256sum -c -; then
            echo "::error::Niagara APK sha256 mismatch (expected ${NIAGARA_SHA256}, got $(sha256sum "$apk" | cut -d' ' -f1)) for $url"
            exit 1
          fi
          echo "NIAGARA_APK=$apk" >> "$GITHUB_ENV"

      # Build before the emulator starts, so compilation does not compete with it for CPU;
      # run-e2e.sh's own Gradle calls are then mostly up to date.
      - name: Build app and E2E APKs
        run: |
          ./gradlew --console=plain :app:assembleDebug :e2e:assembleDebug
          # Free the daemons' RAM (Gradle up to 2 GB heap + Kotlin daemon) while the emulator boots and is
          # provisioned; run-e2e.sh starts a fresh daemon for the install and test steps.
          ./gradlew --stop

      # Host-side evidence if the emulator dies again (run 2: emulator process vanished during provisioning):
      # memory every 10 s for the rest of the job, uploaded with the diagnostics.
      - name: Start host memory sampler
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifacts/host"
          # Each sample: time, load average, memory, and the emulator's QEMU process (pid, RSS KiB, %CPU, uptime).
          # The emulator 37 binary is qemu/linux-x86_64/qemu-system-x86_64 (comm is cut to 15 chars, so match -f).
          cat > "$RUNNER_TEMP/host-sampler.sh" <<'EOF'
          while :; do
            echo "== $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg)"
            free -m | sed -n 2,3p
            pids=$(pgrep -d, -f 'qemu-system-x86_64' || true)
            if [ -n "$pids" ]; then
              ps -o pid,rss,pcpu,etime,args -p "$pids" | cut -c1-120
              # Busiest QEMU threads by name: vCPU threads vs renderer / software-GPU workers show where a freeze spins.
              top -b -H -n 1 -p "${pids%%,*}" | sed -n '7,19p' | cut -c1-110
            else
              echo "no qemu-system process"
            fi
            sleep 10
          done
          EOF
          nohup bash "$RUNNER_TEMP/host-sampler.sh" > "$RUNNER_TEMP/e2e-artifacts/host/memory.log" 2>&1 &

      - name: E2E suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        with:
          api-level: 36
          # system-images;android-36;google_apis_playstore;x86_64: Google Play image, ships Google Maps.
          target: google_apis_playstore
          arch: x86_64
          # pixel_8 is unknown to the runner image's cmdline-tools 12.0; pixel_7 has the same screen as the local
          # pixel_8 AVD (1080x2400, 420 dpi density bucket), which setup-emulator.sh's fixed coordinates rely on.
          profile: pixel_7
          # 2 vCPUs (was 3) leave the 4-vCPU runner two cores for the host-side software renderer; run 3 showed
          # QEMU at 263-314 % CPU during the freeze.
          cores: 2
          ram-size: 4096M
          heap-size: 228M
          # Play Store AVDs force a 6 GB data partition anyway (decisions 1.2).
          disk-size: 6G
          emulator-boot-timeout: 900
          # Runs 2 and 3: the whole guest froze ~45 s after boot, when setup tapped Niagara's "Agree & Continue";
          # QEMU stayed busy (run 3: 263-314 % CPU, ~5 GB RSS, no host OOM) and exited ~37 s into the freeze. Host decoders and
          # guest Vulkan were already off in run 3 (props confirmed), so the remaining suspect is the host renderer.
          # -gpu software (was swiftshader_indirect): swiftshader_indirect, swangle_indirect and guest are deprecated
          # since emulator 36.4.9, which made '-gpu software' the supported software path (Lavapipe by default).
          # -feature -HardwareDecoder / -Vulkan stay (guest software codecs, no guest Vulkan; HWUI uses skiagl).
          # run-e2e.sh logs the hwcodec/vulkan props so a run shows they took effect. Details: docs/release-procedure.md.
          # Run 4 (lavapipe/swangle): same freeze; thread samples showed a deadlock, not a spin: 2 s after the tap
          # every QEMU thread incl. the vCPUs was idle except one gfxstream render thread in D state (blocked in the
          # host kernel), while composer3 (host composition) had been the busiest guest process just before.
          # -feature -HostComposition (attempt 5): hwcomposer composes in the guest instead of through the host
          # render pipe (flag present in emulator 37.2.12's advancedFeatures.ini).
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu software -camera-back none -feature -HardwareDecoder -feature -Vulkan -feature -HostComposition
          # Attempt 5: animations off for the whole CI run (set by the runner right after boot, before setup), so
          # Niagara's onboarding transition renders a single frame instead of an animation. Nothing in the suite or
          # setup relies on animations (UI Automator waits on objects; long-press/swipe timing is input-side).
          # Local AVDs keep animations on.
          disable-animations: true
          # One command: the runner runs each script line in its own `sh -c`; the emulator is killed afterwards,
          # so run-e2e.sh collects logcat and failure diagnostics itself (E2E_ARTIFACTS_DIR).
          script: bash e2e/run-e2e.sh --console=plain

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            e2e/build/outputs/androidTest-results/
            e2e/build/reports/androidTests/
            e2e/build/outputs/run-e2e-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect host diagnostics
        if: failure() || cancelled()
        run: |
          d="$RUNNER_TEMP/e2e-artifacts/host"
          mkdir -p "$d"
          free -m > "$d/free.txt"
          ps aux --sort=-rss | head -25 > "$d/ps.txt"
          { sudo dmesg -T 2>&1 || true; } > "$d/dmesg.txt"
          echo "dmesg lines about OOM / kills / crashes:"
          grep -i -E 'oom|out of memory|killed process|segfault|general protection|qemu|emulator' "$d/dmesg.txt" || echo "(none)"
          # Emulator crash reports ("Storing crashdata in: /tmp/android-<user>/emu-crash-<ver>.db") and AVD logs.
          for p in /tmp/android-*; do [ -e "$p" ] && cp -r "$p" "$d/" ; done
          cp ~/.android/avd/*.avd/*.ini ~/.android/avd/*.avd/*.log "$d/" 2>/dev/null || true
          find "$d" -maxdepth 3 -printf '%10s %p\n' | head -60

      - name: Upload E2E diagnostics (logcat, screenshots, UI dump, host)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Release build
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Check signing secrets
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] \
             && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release not signed::Signing secrets are not set (all four RELEASE_* secrets needed). Building an unsigned release APK as a compile/R8 check only; nothing is uploaded."
          fi

      - name: Reconstruct keystore from secrets
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$dir/release.jks"
          cat > "$dir/keystore.properties" <<EOF
          storeFile=$dir/release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          echo "NAVSHORT_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew --console=plain assembleRelease

      - name: Build unsigned release APK (no secrets; not uploaded)
        if: steps.signing.outputs.available != 'true'
        env:
          # Make sure no properties file is picked up by accident.
          NAVSHORT_KEYSTORE_PROPERTIES: ${{ runner.temp }}/no-signing/keystore.properties
        run: ./gradlew --console=plain assembleRelease -x validateSigningRelease

      - name: Verify signature, name and checksum
        if: steps.signing.outputs.available == 'true'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          src=app/build/outputs/apk/release/app-release.apk
          out="$("$apksigner" verify --print-certs -v "$src")"
          echo "$out" | grep -E '^(Verifies|Verified using|Signer #1 certificate (DN|SHA-256))'
          echo "$out" | grep -qx 'Verifies' || { echo "::error::release APK does not verify"; exit 1; }
          echo "$out" | grep -q '^Signer #1 certificate DN: CN=Matic Leva$' || { echo "::error::unexpected signer DN"; exit 1; }
          version="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionName"])' app/build/outputs/apk/release/output-metadata.json)"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          name="navigation-shortcuts-${version}.apk"
          cp "$src" "$dist/$name"
          (cd "$dist" && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
